[project]
name = "recall-coach"
version = "0.3.0"
description = "DSA practice coach for any judge: an MCP server, a dashboard and trained models for what you will forget and what you can solve next"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "leetcode", "codeforces", "dsa", "spaced-repetition", "fsrs", "machine-learning", "knowledge-tracing", "elo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
authors = [
    { name = "aaryagodbole", email = "aaryagodbole2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fsrs>=6.3,<7",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
]

[project.scripts]
recall-coach = "recall_coach:main"
# The command's name before the rename, so existing MCP client configs keep working.
dsa-coach-mcp = "recall_coach:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["recall_coach", "evals"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["recall_coach"]
branch = true

[project.urls]
Homepage = "https://github.com/aaryagodbole/recall-coach"
Issues = "https://github.com/aaryagodbole/recall-coach/issues"

[project.optional-dependencies]
optimizer = [
    "fsrs[optimizer]>=6.3,<7",
]
