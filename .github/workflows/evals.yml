name: Agent evals

# Calls a model API, so it never runs on its own: start it from the Actions tab.
# Configure the model with repository variables, never in code:
#   EVALS_BASE_URL  the API base, before /chat/completions
#   EVALS_MODEL     the model name as that API expects it
# and, if the API needs a key, the repository secret EVALS_API_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

# Queue a second dispatch behind the first rather than paying for two at once.
concurrency:
  group: agent-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Run agent evals
        # Shorter than the job's limit, so a timed-out run still uploads its results.
        timeout-minutes: 25
        env:
          EVALS_BASE_URL: ${{ vars.EVALS_BASE_URL }}
          EVALS_MODEL: ${{ vars.EVALS_MODEL }}
          EVALS_API_KEY: ${{ secrets.EVALS_API_KEY }}
        run: uv run python -m evals.run --out evals-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evals-results
          path: evals-results.json
