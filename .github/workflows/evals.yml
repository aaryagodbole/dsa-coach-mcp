name: Agent evals

# Calls the Claude API, so it never runs on its own: start it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model that drives the tools
        default: claude-opus-5-5
      effort:
        description: Effort level
        default: medium
        type: choice
        options: [low, medium, high, xhigh, max]

permissions:
  contents: read

# Queue a second dispatch behind the first rather than paying for two at once.
concurrency:
  group: agent-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --all-groups
      - name: Run agent evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: uv run --all-groups python -m evals.run --model "$MODEL" --effort "$EFFORT" --out evals-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evals-results
          path: evals-results.json
