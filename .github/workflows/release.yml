name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dsa-coach-mcp/
    permissions:
      # PyPI trusted publishing: no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A rerun after a partial upload skips the files already on PyPI. PyPI never
          # lets a filename change, and every run builds the same tag.
          skip-existing: true

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^(## )?\[[^]]+\]/ {exit} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no notes under ## [$version]" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    env:
      # Upgrade deliberately; never the mutable releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.1
    permissions:
      # GitHub OIDC proves ownership of the io.github.aaryagodbole namespace.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher, verifying its signature
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm "$archive" "$archive.sigstore.json"
      - name: Stamp server.json with the released version
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Check whether this version is already listed
        id: listed
        run: |
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          url="https://registry.modelcontextprotocol.io/v0/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/$version"
          status=$(curl --silent --show-error --output listed.json --write-out '%{http_code}' "$url")
          if [ "$status" = 404 ]; then
            echo "listed=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 200 ]; then
            # A rerun of the same release: the registry rejects duplicate versions, so
            # skip only when what is listed is what this release would publish.
            fields='{description, version, packages: [(.packages // [])[] | {registryType, identifier, version}]}'
            if [ "$(jq -S "$fields" server.json)" = "$(jq -S ".server | $fields" listed.json)" ]; then
              echo "listed=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name $version is already listed with different metadata" >&2
              exit 1
            fi
          else
            echo "registry lookup failed with HTTP $status" >&2
            exit 1
          fi
      - if: steps.listed.outputs.listed == 'false'
        run: ./mcp-publisher login github-oidc
      - if: steps.listed.outputs.listed == 'false'
        run: ./mcp-publisher publish

